<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calvin Gilbert – Under Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #dcd9d2;
  --ink: #1c1c1a;
  --tape: #f5c400;
  --muted: #55534d;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a18; --ink: #efece4; --muted: #a3a097; color-scheme: dark;
  }
}
:root[data-theme="dark"] { --bg: #1a1a18; --ink: #efece4; --muted: #a3a097; color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  overflow: hidden;
  position: relative;
}
main {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 clamp(20px, 6vw, 88px);
}
h1 {
  margin: 0;
  font-weight: 800;
  font-size: clamp(3.4rem, 15vw, 12rem);
  line-height: 0.88;
  letter-spacing: -0.04em;
}
h1 span { display: block; }
p {
  margin: clamp(18px, 3vw, 32px) 0 0;
  font-size: clamp(1rem, 2vw, 1.35rem);
  font-weight: 500;
  color: var(--muted);
}
.tape {
  position: absolute;
  left: -10%;
  width: 120%;
  bottom: 12%;
  transform: rotate(-4deg);
  background: var(--tape);
  color: #1c1c1a;
  overflow: hidden;
  white-space: nowrap;
  padding: 14px 0;
  border-block: 4px solid #1c1c1a;
}
.tape div {
  display: inline-block;
  font-weight: 800;
  font-size: clamp(1rem, 2.4vw, 1.6rem);
  letter-spacing: 0.04em;
  animation: slide 28s linear infinite;
}
@keyframes slide { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .tape div { animation: none; } }
</style>
</head>
<body>
<main>
  <h1><span>Calvin</span><span>Gilbert</span></h1>
  <p>This website is under construction.</p>
</main>
<div class="tape" aria-hidden="true">
  <div id="t"></div>
</div>
<script>
  var s = "UNDER CONSTRUCTION \u00A0\u2022\u00A0 ";
  document.getElementById("t").textContent = s.repeat(24);
</script>
</body>
</html>
